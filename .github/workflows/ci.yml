name: B2B checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: b2b
          POSTGRES_PASSWORD: b2b_ci_only
          POSTGRES_DB: b2b
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U b2b -d b2b"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: local
      DATABASE_URL: postgresql://b2b:b2b_ci_only@127.0.0.1:5432/b2b?schema=public
      SITE_URL: http://127.0.0.1:3001
      DEMO_ENABLED: "true"
      PAYMENT_PROVIDER: mock
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm install -g pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run setup
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Browser verification against standalone build
        shell: bash
        run: |
          node scripts/start.mjs > /tmp/b2b-web.log 2>&1 &
          web_pid=$!
          trap 'kill "$web_pid" 2>/dev/null || true' EXIT
          node scripts/wait-for-server.mjs
          pnpm test:e2e
