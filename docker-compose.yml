services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: b2b
      POSTGRES_PASSWORD: b2b_local_only
      POSTGRES_DB: b2b
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["db_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U b2b -d b2b"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  db_data:
